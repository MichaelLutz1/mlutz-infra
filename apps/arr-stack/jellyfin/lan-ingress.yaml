apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-lan
  namespace: arr-stack
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin-service
                port:
                  number: 8096
