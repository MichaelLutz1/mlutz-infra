apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-lan
  namespace: arr-stack
  annotations:
    gethomepage.dev/description: Movie Searcher
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/icon: radarr.png
    gethomepage.dev/name: Radarr
    gethomepage.dev/pod-selector: "app=radarr"
spec:
  ingressClassName: traefik
  rules:
    - host: radarr.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr-service
                port:
                  number: 7878
