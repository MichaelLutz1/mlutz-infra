apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-lan
  namespace: arr-stack
spec:
  ingressClassName: traefik
  rules:
    - host: radarr.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr-service
                port:
                  number: 7878
