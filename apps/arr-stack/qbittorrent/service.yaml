apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-service
  namespace: arr-stack
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: webui
    - port: 6881
      targetPort: 6881
      protocol: TCP
      name: torrent-tcp
    - port: 6881
      targetPort: 6881
      protocol: UDP
      name: torrent-udp
