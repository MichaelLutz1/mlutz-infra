apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbitt-lan
  namespace: arr-stack
spec:
  ingressClassName: traefik
  rules:
    - host: qbittorrent.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent-service
                port:
                  number: 8080
