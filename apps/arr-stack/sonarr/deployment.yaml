apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: arr-stack
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: optiplex
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:4.0.20
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8989
        volumeMounts:
        - name: sonarr-data
          mountPath: /data
        - name: sonarr-config
          mountPath: /config
        env:
          - name: PUID
            value: "1000"
          - name: GUID
            value: "1000"
          - name: TZ
            value: America/New_York
      volumes:
      - name: sonarr-data
        persistentVolumeClaim:
          claimName: data-pvc
      - name: sonarr-config
        persistentVolumeClaim:
          claimName: sonarr-config-pvc
