apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homepage
    ingress: true
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - icon: github.png
              href: https://github.com/MichaelLutz1/mlutz-infra
              description: Infra Repo
        - Proton:
            - icon: proton-vpn.png
              href: https://account.proton.me/u/4/vpn/dashboardV2
        - Cloudflare:
            - icon: cloudflare.png
              href: https://dash.cloudflare.com/d89cca3c29773542d0c4440e0d708b2f/one/networks/connectors
              description: Cloudflare Zero Trust
        - Tailscale:
            - icon: tailscale.png
              href: https://console.tailscale.com/admin/machines
  services.yaml: |
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
