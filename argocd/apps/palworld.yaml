apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palworld
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MichaelLutz1/mlutz-infra.git
    targetRevision: main
    path: apps/palworld

  destination:
    server: https://kubernetes.default.svc
    namespace: palworld

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
