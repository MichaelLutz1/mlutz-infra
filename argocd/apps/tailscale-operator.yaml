apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.98.9
      helm:
        releaseName: tailscale-operator
    - repoURL: https://github.com/MichaelLutz1/mlutz-infra.git
      targetRevision: main
      path: apps/tailscale-operator
  destination:
    server: "https://kubernetes.default.svc"
    namespace: tailscale
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
